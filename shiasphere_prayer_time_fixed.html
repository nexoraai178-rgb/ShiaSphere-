<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prayer Time • ShiaSphere</title><link rel="stylesheet" href="style.css"><style>main{max-width:760px;margin:auto;padding:20px 16px 100px}.box{background:#10231f;border:1px solid rgba(216,182,93,.22);border-radius:22px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.t{display:flex;justify-content:space-between;padding:14px;background:#0a1714;border-radius:15px}.t span{color:#f0d98d;font-weight:700}button{padding:11px 14px;border-radius:14px;background:#143a31;color:white;border:1px solid rgba(216,182,93,.35);margin:4px}.muted{color:#aab3ae}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="index.html">← Home</a><h1>🕌 Prayer Time</h1><p class="muted">Live local Namaz timings + Shia Azaan</p><section class="box"><h2>📍 Location</h2><p id="s" class="muted">Requesting location…</p><button id="loc">Allow / Refresh Location</button></section><section class="box"><h2>Today's Namaz Time</h2><p id="d" class="muted">—</p><div id="times" class="grid"></div><p id="next">Next prayer: —</p></section><section class="box"><h2>🔊 Shia Azaan</h2><p class="muted">Keep <b>shia_azan.mp3</b> in the same folder.</p><button id="en">Enable Azaan</button><button id="test">Test Azaan</button><p id="as" class="muted">Azaan disabled.</p></section></main><script>
const audio=new Audio("shia_azan.mp3");let T=null,E=false,P={};const $=x=>document.getElementById(x);
function date(){let x=new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function min(v){let m=String(v||"").split(" ")[0].match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null}
function fmt(v){let n=min(v);if(n===null)return"—";let h=Math.floor(n/60),m=n%60,a=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+a}
function draw(t){let x=[["Fajr",t.Fajr],["Sunrise",t.Sunrise],["Dhuhr",t.Dhuhr],["Asr",t.Asr],["Maghrib",t.Maghrib],["Isha",t.Isha]];$("times").innerHTML=x.map(q=>'<div class="t"><b>'+q[0]+'</b><span>'+fmt(q[1])+'</span></div>').join("")}
async function load(lat,lon){$("s").textContent="Loading Namaz timings…";try{let r=await fetch("https://api.aladhan.com/v1/timings/"+date()+"?latitude="+lat+"&longitude="+lon+"&method=0",{cache:"no-store"});if(!r.ok)throw 0;let j=await r.json();if(j.code!==200)throw 0;T=j.data.timings;draw(T);$("d").textContent=(j.data.date?.readable||date())+" • "+(j.data.meta?.timezone||"Local time");$("s").textContent="Namaz timings loaded.";next()}catch(e){$("s").textContent="Namaz timings load nahi ho pa rahe. Internet/location check karke Refresh dabao."}}
function location(){if(!navigator.geolocation){$("s").textContent="Location supported nahi hai.";return}$("s").textContent="Location permission maang raha hai…";navigator.geolocation.getCurrentPosition(x=>load(x.coords.latitude,x.coords.longitude),()=>{$("s").textContent="Location denied. Browser settings me Location allow karke Refresh dabao."},{enableHighAccuracy:true,timeout:15000,maximumAge:300000})}
function next(){if(!T)return;let n=new Date(),now=n.getHours()*60+n.getMinutes(),a=[["Fajr",T.Fajr],["Dhuhr",T.Dhuhr],["Asr",T.Asr],["Maghrib",T.Maghrib],["Isha",T.Isha]],q=a.find(x=>min(x[1])>now);$("next").textContent=q?"Next prayer: "+q[0]+" • "+fmt(q[1]):"Next prayer: Fajr tomorrow"}
function az(){if(!E||!T)return;let n=new Date(),now=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),k=date();["Fajr","Dhuhr","Asr","Maghrib","Isha"].forEach(q=>{if(String(T[q]).split(" ")[0]===now&&!P[k+q]){P[k+q]=1;audio.currentTime=0;audio.play().catch(()=>{$("as").textContent="Automatic audio blocked. Test Azaan dabao."})}})}
$("loc").onclick=location;$("en").onclick=async()=>{try{audio.muted=true;await audio.play();audio.pause();audio.currentTime=0;audio.muted=false;E=true;$("as").textContent="Azaan enabled."}catch(e){$("as").textContent="Test Azaan dabakar browser audio permission do."}};$("test").onclick=async()=>{try{audio.currentTime=0;await audio.play();E=true;$("as").textContent="Azaan test playing."}catch(e){$("as").textContent="shia_azan.mp3 same folder me rakho."}};setInterval(next,30000);setInterval(az,1000);location();
</script></body></html>
